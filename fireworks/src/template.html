<!DOCTYPE html>

<style>

x solid var(--line);border-radius:18px;background:var(--panel);backdrop-filter:blur(18px);padding:21px 23px 19px}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.panel-head h2{margin:0;font-size:14px;font-weight:500;letter-spacing:1px}.panel-head span{font-size:10px;letter-spacing:2px;color:#7288a3}.label{display:flex;justify-content:space-between;font-size:11px;color:#93a3b9;margin-bottom:10px}.label strong{font-weight:400;color:#d8e2f1}.shapes{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:17px}.shape{border-radius:9px;padding:10px 2px 7px;color:#879ab4;background:#121e31;font-size:10px}.shape svg{display:block;margin:0 auto 5px;width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.15}.shape.selected{color:var(--accent);border-color:#7c6243;background:#302b26}.palette-row{display:flex;align-items:center;justify-content:space-between;margin:0 0 17px}.palette-row .label{margin:0}.swatches{display:flex;gap:9px}.swatch{width:23px;height:23px;border-radius:50%;padding:3px;position:relative;background:none;border:1px solid transparent}.swatch i{display:block;width:15px;height:15px;border-radius:50%;background:var(--swatch)}.swatch.selected{border-color:#e8d9c7}.swatch[data-palette=aurora] i{background:conic-gradient(#69edff,#b792f7,#ff8db5,#69edff)}.range-row{display:flex;gap:13px;align-items:center;margin-bottom:16px}.range-row span{font-size:11px;color:#93a3b9;white-space:nowrap}.range-row output{font-size:11px;color:#dce5f3;min-width:27px}input[type=range]{appearance:none;width:100%;height:3px;background:#2e415c;accent-color:var(--accent);cursor:pointer}input[type=range]::-webkit-slider-thumb{appearance:none;width:11px;height:11px;border-radius:50%;background:var(--accent)}.switches{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px;color:#a5b4c8;font-size:11px}.switch{display:flex;align-items:center;gap:8px;cursor:pointer}.switch input{appearance:none;width:27px;height:15px;background:#2a374a;border-radius:10px;position:relative;margin:0;cursor:pointer}.switch input:after{content:"";width:9px;height:9px;background:#8f9db3;position:absolute;border-radius:50%;left:3px;top:3px;transition:left .2s}.switch input:checked{background:#62503a}.switch input:checked:after{left:15px;background:#ffcf91}.launch-panel{right:40px;bottom:35px;text-align:right}.launch-panel .overline{font-size:10px;letter-spacing:2.5px;color:#8093ad;margin-bottom:7px}.launch-panel .statement{font-size:24px;font-weight:300;letter-spacing:2px;color:#dce5f2;margin:0 0 19px}.launch-actions{display:flex;gap:9px;justify-content:flex-end}.launch-actions button{border-radius:11px;padding:13px 19px;font-size:12px;letter-spacing:1px}.launch-actions #launch{background:var(--accent);color:#292118;border-color:var(--accent);min-width:132px;font-weight:500}.launch-actions #launch:hover{background:#ffe0b7}.secondary{display:flex;justify-content:flex-end;align-items:center;gap:16px;margin-top:17px;font-size:10px;color:#788ba5}.secondary button{border:0;background:none;padding:0;color:#a7b6c9;font-size:11px}.secondary kbd{font:10px "Segoe UI",sans-serif;border:1px solid #33435c;border-radius:4px;padding:2px 5px;color:#9aadc5;margin-right:4px}.middle-hint{bottom:34px;left:50%;transform:translateX(-50%);font-size:10px;color:#4c6381;letter-spacing:2px;pointer-events:none}.counter{position:fixed;right:43px;top:123px;text-align:right;pointer-events:none}.counter b{font-size:35px;font-weight:300;letter-spacing:2px;color:#c5d3e7;font-variant-numeric:tabular-nums}.counter div{font-size:9px;letter-spacing:2px;color:#7187a4}.counter small{font-size:10px;color:#788aa5;display:block;margin-top:3px}#toast{position:fixed;left:50%;top:98px;transform:translate(-50%,-8px);opacity:0;transition:.25s;padding:9px 17px;border-radius:30px;background:#132036ee;color:#d7e3f7;border:1px solid var(--line);z-index:8;pointer-events:none;font-size:12px;white-space:nowrap}#toast.show{opacity:1;transform:translate(-50%,0)}#reticle{position:fixed;width:30px;height:30px;border:1px solid #ffd39d;border-radius:50%;pointer-events:none;opacity:0;z-index:1;transform:translate(-50%,-50%)}#reticle.pop{animation:reticle .55s ease-out}@keyframes reticle{0%{opacity:1;transform:translate(-50%,-50%) scale(.4)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.6)}}#loading{position:fixed;inset:0;background:#040b19;display:grid;place-content:center;text-align:center;z-index:20;transition:opacity .5s}#loading h2{font-size:20px;letter-spacing:4px;font-weight:400}#loading p{font-size:12px;color:#91a2ba}#loading.ready{opacity:0;pointer-events:none}#exit-cinema{display:none;position:fixed;right:20px;top:20px;z-index:5;padding:8px 13px;border-radius:20px;background:#15213a88;font-size:11px}.cinema .ui{opacity:0;pointer-events:none}.cinema .ui *{pointer-events:none!important}.cinema #exit-cinema{display:block}.vignette{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,#03091422 0%,transparent 25%,transparent 68%,#03091699 100%);z-index:1}
@media(max-height:680px) and (min-width:701px){.top{top:23px}.caption{top:98px}.counter{top:99px}.control-panel{bottom:23px;padding:15px 19px;width:306px}.panel-head{margin-bottom:11px}.shapes{margin-bottom:12px}.shape{padding:7px 2px 5px}.palette-row{margin-bottom:11px}.range-row{margin-bottom:12px}.switches{padding-top:10px}.launch-panel{bottom:23px}.middle-hint{display:none}}
@media(max-width:700px){.top{top:22px;left:20px;right:20px}.brand{gap:9px}.brand h1{font-size:21px}.brand h1 span{display:none}.eyebrow{font-size:8px;letter-spacing:2px}.mark{width:31px;height:31px}.statusbar{gap:9px;font-size:9px}.statusbar .perf{display:none}.caption{left:22px;top:96px}.caption h2{font-size:11px}.caption p{font-size:9px}.counter{right:22px;top:91px}.counter b{font-size:28px}.counter small{display:none}.control-panel{left:16px;right:16px;bottom:105px;width:auto;border-radius:14px;padding:13px 15px}.panel-head{display:none}.control-panel>.label{margin-bottom:7px}.shape{padding:7px 2px 5px}.shape svg{width:19px;height:19px;margin-bottom:3px}.shapes{gap:7px;margin-bottom:12px}.palette-row{margin-bottom:11px}.range-row{margin-bottom:10px}.switches{padding-top:10px}.launch-panel{left:16px;right:16px;bottom:16px}.launch-panel .overline,.launch-panel .statement{display:none}.launch-actions{justify-content:stretch}.launch-actions button{flex:1;padding:11px}.secondary{margin-top:10px;font-size:9px;gap:13px}.middle-hint{display:none}.keyboard{display:none}#toast{top:145px;font-size:11px}.vignette{background:linear-gradient(180deg,transparent 50%,#030916aa 100%)}}

</head>
<body>
<canvas id="scene" aria-label="交互式三维烟花夜空，点击发射烟花"></canvas><div class="vignette"></div>
<header class="top ui"><div class="brand"><svg class="mark" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.1"><path d="M20 3v11m0 12v11M3 20h11m12 0h11M8 8l8 8m8 8 8 8M8 32l8-8m8-8 8-8"/><circle cx="20" cy="20" r="2" fill="currentColor"/><circle cx="20" cy="3" r="1"/><circle cx="37" cy="20" r="1"/></svg><div><div class="eyebrow">AFTERGLOW / PARTICLE STUDY</div><h1>余焰<span>烟花粒子实验室</span></h1></div></div><div class="statusbar"><span class="live"><i class="dot"></i><span id="status">实时演算</span></span><span><b id="particle-count">0</b> 粒子</span><span class="perf"><b id="fps">—</b> FPS</span><button id="cinema" title="沉浸模式" aria-label="进入沉浸模式"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor"><path d="M7 3H3v4m10-4h4v4M3 13v4h4m10-4v4h-4"/></svg></button></div></header>
<div class="caption ui"><h2>把一瞬间，留给夜空。</h2><p>点击任意位置 · 在那里绽放</p></div>
<div class="counter ui"><b id="burst-count">00</b><div>BURSTS IN THE SKY</div><small id="last-burst">等待第一束光</small></div>
<section class="control-panel ui" aria-label="烟花设置"><div class="panel-head"><h2>设计一束光</h2><span>01 / FORM</span></div><div class="label"><span>绽放形态</span><strong id="shape-name">星芒牡丹</strong></div><div class="shapes">
<button class="shape selected" data-shape="peony" aria-label="星芒牡丹" aria-pressed="true"><svg viewBox="0 0 26 26"><path d="M13 1v8m0 8v8M1 13h8m8 0h8M4 4l6 6m6 6 6 6M4 22l6-6m6-6 6-6"/><circle cx="13" cy="13" r="2"/></svg>牡丹</button>
<button class="shape" data-shape="willow" aria-label="流金垂柳" aria-pressed="false"><svg viewBox="0 0 26 26"><path d="M13 6C2 4 2 16 2 22M13 6C6 6 7 17 7 24M13 6v18M13 6c7 0 6 11 6 18M13 6c11-2 11 10 11 16"/></svg>垂柳</button>
<button class="shape" data-shape="ring" aria-label="星环交响" aria-pressed="false"><svg viewBox="0 0 26 26"><ellipse cx="13" cy="13" rx="12" ry="5" transform="rotate(-25 13 13)"/><ellipse cx="13" cy="13" rx="6" ry="12" transform="rotate(-25 13 13)"/></svg>星环</button>
<button class="shape" data-shape="heart" aria-label="心形绽放" aria-pressed="false"><svg viewBox="0 0 26 26"><path d="M13 23C9 19 1 14 1 8a6 6 0 0 1 12-1 6 6 0 0 1 12 1c0 6-8 11-12 15Z"/></svg>心形</button></div>
<div class="palette-row"><span class="label">光谱配色</span><div class="swatches"><button class="swatch selected" data-palette="aurora" title="极光" aria-label="极光配色" aria-pressed="true"><i></i></button><button class="swatch" data-palette="gold" style="--swatch:#ffd08a" title="鎏金" aria-label="鎏金配色" aria-pressed="false"><i></i></button><button class="swatch" data-palette="ice" style="--swatch:#76e5ff" title="冰蓝" aria-label="冰蓝配色" aria-pressed="false"><i></i></button><button class="swatch" data-palette="rose" style="--swatch:#ff8bc4" title="蔷薇" aria-label="蔷薇配色" aria-pressed="false"><i></i></button></div></div>
<label class="range-row"><span>粒子密度</span><input id="density" type="range" min="0.5" max="1.8" value="1" step="0.1" aria-label="粒子密度"><output id="density-value">1.0×</output></label><div class="switches"><label class="switch"><input id="auto" type="checkbox" checked>自动燃放</label><label class="switch"><input id="glow" type="checkbox" checked>光晕效果</label></div></section>
<div class="launch-panel ui"><div class="overline">EVERY SPARK, A LITTLE UNIVERSE</div><p class="statement">下一场绚烂，由你点亮。</p><div class="launch-actions"><button id="finale">九重齐放</button><button id="launch">发射烟花 ↗</button></div><div class="secondary"><button id="pause" aria-pressed="false">暂停</button><button id="photo">保存画面</button><span class="keyboard"><kbd>Space</kbd>齐放　<kbd>P</kbd>暂停</span></div></div>
<div class="middle-hint ui">THREE.JS · REAL-TIME PARTICLES</div><div id="reticle"></div><div id="toast" role="status" aria-live="polite"></div><button id="exit-cinema">退出沉浸</button>
<div id="loading"><h2>点亮这片夜空</h2><p>正在准备粒子与光影</p></div>
<script>__BUNDLED_CODE__</script>
</body></html>
